name: OpenVPN Dual Local HTTP Proxy

on:
  workflow_dispatch:

jobs:
  vpn-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download .ovpn files
        run: |
          curl -fsSL https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/vpn.ovpn -o vpn1.ovpn
          curl -fsSL https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/vpn2.ovpn -o vpn2.ovpn
          test -s vpn1.ovpn && test -s vpn2.ovpn && echo "Both OVPN files downloaded."

      - name: Create tinyproxy config
        run: |
          cat > tinyproxy.conf <<'EOF'
          Port 8888
          Listen 0.0.0.0
          Timeout 600
          Allow 0.0.0.0/0
          DisableViaHeader Yes
          LogLevel Info
          MaxClients 50
          EOF
          sed -i 's/^[[:space:]]*//' tinyproxy.conf

      - name: Check Original Runner IP
        run: |
          echo "Original Public IP:"
          curl -s --max-time 15 https://api.ipify.org
          echo ""

      - name: Start both OpenVPN containers
        run: |
          # কনটেইনারের ভেতরে দুটোই 8888 পোর্টে চলবে, হোস্টে আলাদা পোর্টে ম্যাপ হবে
          # vpn1 -> 127.0.0.1:8888 , vpn2 -> 127.0.0.1:8889
          for n in 1 2; do
            HOST_PORT=$((8887 + n))
            docker run -d \
              --name openvpn-$n \
              --privileged \
              --cap-add=NET_ADMIN \
              --device /dev/net/tun \
              --dns 8.8.8.8 --dns 1.1.1.1 \
              -p 127.0.0.1:$HOST_PORT:8888 \
              -v $(pwd)/vpn$n.ovpn:/etc/openvpn/client.ovpn:ro \
              -v $(pwd)/tinyproxy.conf:/etc/tinyproxy/custom.conf:ro \
              alpine:latest \
              sh -c "apk add --no-cache openvpn curl iproute2 tinyproxy && openvpn --config /etc/openvpn/client.ovpn"
          done

      - name: Wait for both VPN connections
        run: |
          for n in 1 2; do
            echo "Waiting for openvpn-$n ..."
            ok=0
            for i in $(seq 1 60); do
              if docker logs openvpn-$n 2>&1 | grep -q "Initialization Sequence Completed"; then
                echo "openvpn-$n connected."
                ok=1
                break
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' openvpn-$n)" != "true" ]; then
                echo "openvpn-$n exited early:"
                docker logs openvpn-$n
                exit 1
              fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "Timeout waiting for openvpn-$n"
              docker logs openvpn-$n
              exit 1
            fi
          done

      - name: Fix DNS and start tinyproxy in both containers
        run: |
          for n in 1 2; do
            docker exec openvpn-$n sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'
            docker exec -d openvpn-$n tinyproxy -d -c /etc/tinyproxy/custom.conf
          done
          sleep 3
          for n in 1 2; do
            docker exec openvpn-$n sh -c 'ps | grep [t]inyproxy' || { echo "tinyproxy not running in openvpn-$n"; exit 1; }
          done

      - name: Test both proxies
        run: |
          echo "Proxy 1 (127.0.0.1:8888) IP:"
          curl -s --max-time 20 -x http://127.0.0.1:8888 https://api.ipify.org
          echo ""
          echo "Proxy 2 (127.0.0.1:8889) IP:"
          curl -s --max-time 20 -x http://127.0.0.1:8889 https://api.ipify.org
          echo ""

      # ---- আপনার নিজের কাজ এখানে চালান ----
      - name: Run my task through the proxies
        run: |
          echo "Task via proxy 1:"
          curl -s --max-time 20 -x http://127.0.0.1:8888 https://api.ipify.org
          echo ""
          echo "Task via proxy 2:"
          curl -s --max-time 20 -x http://127.0.0.1:8889 https://api.ipify.org
          echo ""
          # এখানে আপনার স্ক্রিপ্ট যোগ করুন

      - name: Cleanup
        if: always()
        run: |
          for n in 1 2; do
            docker logs openvpn-$n 2>&1 | tail -n 20 || true
            docker stop openvpn-$n || true
            docker rm openvpn-$n || true
          done
          rm -f tinyproxy.conf

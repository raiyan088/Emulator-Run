name: OpenVPN Docker IP Check

on:
  workflow_dispatch: # GitHub Console থেকে ম্যানুয়ালি রান করার জন্য
  push:
    branches: [ "main" ]

jobs:
  vpn-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download .ovpn file from URL
        run: |
          echo "Downloading .ovpn file from raw URL..."
          wget -O client.ovpn https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/vpn.ovpn
          
          # Verification: Check if file exists and has content
          test -s client.ovpn && echo "OVPN file downloaded successfully."

      - name: Check Original Runner IP
        run: |
          echo "Original Public IP:"
          curl -s ifconfig.me
          echo ""

      - name: Run OpenVPN Container inside Docker
        run: |
          docker run -d \
            --name openvpn-client \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            -v $(pwd)/client.ovpn:/etc/openvpn/client.ovpn:ro \
            dperson/openvpn-client
          
          # Verification: Ensure container is running
          docker ps | grep openvpn-client

      - name: Wait for VPN Tunnel Connection
        run: |
          echo "Waiting for VPN connection to establish..."
          sleep 10

      - name: Check VPN IP inside Docker Container
        run: |
          echo "VPN Container Public IP:"
          docker exec openvpn-client curl -s ifconfig.me
          echo ""
          # Verification: Ensure tunnel interface (tun0) is UP inside container
          docker exec openvpn-client ip a show tun0

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop openvpn-client || true
          docker rm openvpn-client || true

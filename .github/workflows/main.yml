name: OpenVPN Docker IP Check

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  vpn-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download .ovpn file from URL
        run: |
          echo "Downloading .ovpn file..."
          curl -sSL https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/vpn.ovpn -o client.ovpn
          # Verification: Ensure file downloaded and has content
          test -s client.ovpn && echo "OVPN file downloaded successfully."

      - name: Check Original Runner IP
        run: |
          echo "Original Public IP:"
          curl -s ifconfig.me
          echo ""

      - name: Start OpenVPN Container
        run: |
          docker run -d \
            --name openvpn-client \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            -v $(pwd)/client.ovpn:/etc/openvpn/client.ovpn:ro \
            dperson/openvpn-client

      - name: Wait for VPN Tunnel Connection
        run: |
          echo "Waiting for VPN connection to establish..."
          sleep 10
          # Verification: Check if container is running without crashing
          docker ps | grep openvpn-client

      - name: Check VPN Container Public IP
        run: |
          echo "VPN Container Public IP:"
          # curl এর বদলে wget -qO- ব্যবহার করা হয়েছে
          docker exec openvpn-client wget -qO- ifconfig.me
          echo ""
          echo "=== Container Interfaces ==="
          docker exec openvpn-client ip a show tun0

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop openvpn-client || true
          docker rm openvpn-client || true

name: OpenVPN Docker IP Check

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  vpn-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download .ovpn file from URL
        run: |
          echo "Downloading .ovpn file..."
          curl -sSL https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/vpn.ovpn -o client.ovpn
          test -s client.ovpn && echo "OVPN file downloaded successfully."

      - name: Start OpenVPN Container (Foreground Test)
        run: |
          # প্রথমে ফোরগ্রাউন্ডে চালিয়ে চেক করব কোথায় এরর খাচ্ছে
          docker run \
            --name openvpn-client \
            --cap-add=NET_ADMIN \
            --cap-add=SYS_MODULE \
            --device /dev/net/tun \
            -v $(pwd)/client.ovpn:/etc/openvpn/client.ovpn \
            ubuntu:latest \
            bash -c "export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y openvpn curl iproute2 && openvpn --config /etc/openvpn/client.ovpn" &
          
          # ৫ সেকেন্ড সময় দিয়ে চেক করা কন্টেইনার চলছে কি না
          sleep 5
          docker ps

      - name: Debug OpenVPN Logs if Failed
        if: always()
        run: |
          echo "=== OpenVPN Logs ==="
          docker logs openvpn-client || true

      - name: Check VPN Container Public IP
        run: |
          echo "VPN Container Public IP:"
          docker exec openvpn-client curl -s ifconfig.me
          echo ""
          docker exec openvpn-client ip a show tun0

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop openvpn-client || true
          docker rm openvpn-client || true

name: OpenVPN Multi Proxy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  vpn-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # এখানে আপনার সব .ovpn ফাইলের URL দিন (প্রতি লাইনে একটা)
      OVPN_URLS: |
        https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/vpn.ovpn
        https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/vpn2.ovpn

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download .ovpn files
        run: |
          n=0
          while IFS= read -r URL; do
            URL=$(echo "$URL" | xargs)
            [ -z "$URL" ] && continue
            n=$((n+1))
            echo "Downloading vpn$n.ovpn from $URL"
            curl -fsSL "$URL" -o vpn$n.ovpn || { echo "FAILED to download vpn$n.ovpn"; exit 1; }
            test -s vpn$n.ovpn || { echo "vpn$n.ovpn is empty"; exit 1; }
          done <<< "$OVPN_URLS"
          echo "$n" > count.txt
          echo "Total files: $n"

      - name: Create tinyproxy config
        run: |
          printf '%s\n' \
            'Port 8888' \
            'Listen 0.0.0.0' \
            'Timeout 600' \
            'Allow 0.0.0.0/0' \
            'DisableViaHeader Yes' \
            'LogLevel Info' \
            'MaxClients 50' > tinyproxy.conf

      - name: Check Original Runner IP
        run: |
          echo "Original Public IP:"
          curl -s --max-time 15 https://api.ipify.org
          echo ""

      - name: Start all OpenVPN containers
        run: |
          COUNT=$(cat count.txt)
          for n in $(seq 1 $COUNT); do
            HOST_PORT=$((8887 + n))
            echo "Starting openvpn-$n  ->  127.0.0.1:$HOST_PORT"
            docker run -d \
              --name openvpn-$n \
              --privileged \
              --cap-add=NET_ADMIN \
              --device /dev/net/tun \
              --dns 8.8.8.8 --dns 1.1.1.1 \
              -p 127.0.0.1:$HOST_PORT:8888 \
              -v $(pwd)/vpn$n.ovpn:/etc/openvpn/client.ovpn:ro \
              -v $(pwd)/tinyproxy.conf:/etc/tinyproxy/custom.conf:ro \
              alpine:latest \
              sh -c "apk add --no-cache openvpn curl iproute2 tinyproxy && openvpn --config /etc/openvpn/client.ovpn"
          done

      - name: Wait for all VPN connections
        run: |
          COUNT=$(cat count.txt)
          for n in $(seq 1 $COUNT); do
            echo "Waiting for openvpn-$n ..."
            ok=0
            for i in $(seq 1 60); do
              if docker logs openvpn-$n 2>&1 | grep -q "Initialization Sequence Completed"; then
                echo "openvpn-$n connected."
                ok=1
                break
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' openvpn-$n)" != "true" ]; then
                echo "openvpn-$n exited early:"
                docker logs openvpn-$n
                exit 1
              fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "Timeout waiting for openvpn-$n"
              docker logs openvpn-$n
              exit 1
            fi
          done

      - name: Fix DNS and start tinyproxy in all containers
        run: |
          COUNT=$(cat count.txt)
          for n in $(seq 1 $COUNT); do
            docker exec openvpn-$n sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'
            docker exec -d openvpn-$n tinyproxy -d -c /etc/tinyproxy/custom.conf
          done
          sleep 3
          for n in $(seq 1 $COUNT); do
            docker exec openvpn-$n sh -c 'ps | grep [t]inyproxy' || { echo "tinyproxy not running in openvpn-$n"; exit 1; }
          done

      - name: Test all proxies
        run: |
          COUNT=$(cat count.txt)
          for n in $(seq 1 $COUNT); do
            HOST_PORT=$((8887 + n))
            echo "Proxy $n (127.0.0.1:$HOST_PORT) IP:"
            curl -s --max-time 20 -x http://127.0.0.1:$HOST_PORT https://api.ipify.org
            echo ""
          done

      # ---- আপনার নিজের কাজ এখানে চালান ----
      - name: Run my task through the proxies
        run: |
          # Proxy 1 -> http://127.0.0.1:8888
          # Proxy 2 -> http://127.0.0.1:8889
          # Proxy 3 -> http://127.0.0.1:8890  (ইত্যাদি)
          echo "Task via proxy 1:"
          curl -s --max-time 20 -x http://127.0.0.1:8888 https://api.ipify.org
          echo ""
          # এখানে আপনার স্ক্রিপ্ট যোগ করুন

      - name: Debug logs
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo 0)
          for n in $(seq 1 $COUNT); do
            echo "=== openvpn-$n logs (last 30) ==="
            docker logs openvpn-$n 2>&1 | tail -n 30 || true
          done

      - name: Cleanup
        if: always()
        run: |
          COUNT=$(cat count.txt 2>/dev/null || echo 0)
          for n in $(seq 1 $COUNT); do
            docker stop openvpn-$n || true
            docker rm openvpn-$n || true
          done
          rm -f tinyproxy.conf count.txt vpn*.ovpn

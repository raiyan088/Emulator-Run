name: OpenVPN Docker IP Check

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  vpn-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download .ovpn file from URL
        run: |
          echo "Downloading .ovpn file..."
          curl -fsSL https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/vpn.ovpn -o client.ovpn
          test -s client.ovpn && echo "OVPN file downloaded successfully."

      - name: Create tinyproxy config
        run: |
          printf '%s\n' \
            'Port 8888' \
            'Listen 0.0.0.0' \
            'Timeout 600' \
            'Allow 0.0.0.0/0' \
            'DisableViaHeader Yes' \
            'LogLevel Info' \
            'MaxClients 50' > tinyproxy.conf
          cat tinyproxy.conf

      - name: Check Original Runner IP
        run: |
          echo "Original Public IP:"
          curl -s --max-time 15 https://api.ipify.org
          echo ""

      - name: Start OpenVPN Container using Alpine
        run: |
          docker run -d \
            --name openvpn-client \
            --privileged \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun \
            --dns 8.8.8.8 --dns 1.1.1.1 \
            -p 127.0.0.1:8888:8888 \
            -v $(pwd)/client.ovpn:/etc/openvpn/client.ovpn:ro \
            -v $(pwd)/tinyproxy.conf:/etc/tinyproxy/custom.conf:ro \
            alpine:latest \
            sh -c "apk add --no-cache openvpn curl iproute2 tinyproxy && openvpn --config /etc/openvpn/client.ovpn"

      - name: Wait for VPN Tunnel Connection
        run: |
          echo "Waiting for VPN connection to establish..."
          for i in $(seq 1 60); do
            if docker logs openvpn-client 2>&1 | grep -q "Initialization Sequence Completed"; then
              echo "VPN connected."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' openvpn-client)" != "true" ]; then
              echo "Container exited early:"
              docker logs openvpn-client
              exit 1
            fi
            sleep 2
          done
          echo "Timeout waiting for VPN connection."
          docker logs openvpn-client
          exit 1

      - name: Fix DNS inside VPN container
        run: |
          docker exec openvpn-client sh -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'
          echo "=== resolv.conf ==="
          docker exec openvpn-client cat /etc/resolv.conf

      - name: Start tinyproxy inside VPN container
        run: |
          docker exec -d openvpn-client tinyproxy -d -c /etc/tinyproxy/custom.conf
          sleep 3
          docker exec openvpn-client sh -c 'ps | grep [t]inyproxy' || { echo "tinyproxy not running"; exit 1; }

      - name: Debug OpenVPN Logs
        if: always()
        run: |
          echo "=== OpenVPN Logs ==="
          docker logs openvpn-client || true

      - name: Check VPN Container Public IP
        run: |
          echo "VPN Container Public IP:"
          docker exec openvpn-client curl -s --max-time 15 https://api.ipify.org \
            || docker exec openvpn-client curl -s --max-time 15 https://1.1.1.1/cdn-cgi/trace | grep '^ip='
          echo ""
          echo "=== Container Interfaces ==="
          docker exec openvpn-client ip addr show tun0

      - name: Test proxy (http://127.0.0.1:8888)
        run: |
          echo "VPN IP through proxy:"
          curl -s --max-time 20 -x http://127.0.0.1:8888 https://api.ipify.org
          echo ""

      # ---- আপনার নিজের কাজ এখানে চালান, প্রক্সি ব্যবহার করে ----
      - name: Run my task through the proxy
        env:
          HTTP_PROXY: http://127.0.0.1:8888
          HTTPS_PROXY: http://127.0.0.1:8888
        run: |
          echo "My task IP:"
          curl -s --max-time 20 https://api.ipify.org
          echo ""
          # এখানে আপনার স্ক্রিপ্ট যোগ করুন

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop openvpn-client || true
          docker rm openvpn-client || true
          rm -f tinyproxy.conf

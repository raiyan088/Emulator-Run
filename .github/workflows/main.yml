name: OpenVPN Docker IP Check

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  vpn-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download .ovpn file from URL
        run: |
          echo "Downloading .ovpn file..."
          curl -sSL https://raw.githubusercontent.com/raiyan088/script/refs/heads/main/vpn.ovpn -o client.ovpn
          test -s client.ovpn && echo "OVPN file downloaded successfully."

      - name: Check Original Runner IP
        run: |
          echo "Original Public IP:"
          curl -s ifconfig.me
          echo ""

      - name: Start OpenVPN Container
        run: |
          docker run -d \
            --name openvpn-client \
            --cap-add=NET_ADMIN \
            --cap-add=SYS_MODULE \
            --device /dev/net/tun \
            -v $(pwd)/client.ovpn:/etc/openvpn/client.ovpn \
            ubuntu:latest \
            bash -c "export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y openvpn curl iproute2 && openvpn --config /etc/openvpn/client.ovpn --daemon"

      - name: Wait & Verify OpenVPN Connection
        run: |
          echo "Waiting for VPN connection to establish..."
          sleep 12
          echo "=== OpenVPN Process Check ==="
          docker exec openvpn-client ps aux | grep openvpn

      - name: Check VPN Container Public IP & Tun0 Interface
        run: |
          echo "VPN Container Public IP:"
          docker exec openvpn-client curl -s ifconfig.me
          echo ""
          echo "=== Container Interfaces ==="
          docker exec openvpn-client ip a show tun0
          # Verification: Check if tun0 exists and has IP assigned

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop openvpn-client || true
          docker rm openvpn-client || true
